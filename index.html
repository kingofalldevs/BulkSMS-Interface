<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ATU Attendance Management</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #172b35;
			--muted: #687980;
			--line: #e3eaeb;
			--accent: #087e78;
			--accent-dark: #06645f;
			--surface: #ffffff;
			--canvas: #f5f8f7;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			background: var(--canvas);
			color: var(--ink);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		.topbar {
            margin: 0;
			position: relative;
			z-index: 1;
			background: var(--surface);
			border-bottom: 1px solid var(--line);
            font-size: 30px;
		}

		.nav-shell {
			width: min(100% - 48px, 1240px);
			min-height: 72px;
			margin: 0 auto;
		display: grid;
		grid-template-columns: 1fr auto 1fr;
			align-items: center;
		gap: 0;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 11px;
			color: var(--ink);
			text-decoration: none;
			font-size: 18px;
			font-weight: 750;
			letter-spacing: 0;
			white-space: nowrap;
			justify-self: start;
		}

		.brand-mark {
			width: 50px;
			height: 34px;
			display: grid;
			place-items: center;
			border: none;
			background: var(--accent);
			color: white;
			font-size: 18px;
			font-weight: 700;
		}

        .brand-text{
            font-size: 18px;
            font-weight: 400;
        }

		.hero {
			position: relative;
			overflow: hidden;
			min-height: min(680px, calc(100svh - 72px));
			display: flex;
			align-items: center;
			background: #e5f0ec;
			color: var(--ink);
		}

		.hero-chart {
			position: absolute;
			top: 80%;
			width: 350px;
			height: 350px;
			display: flex;
			align-items: flex-end;
			gap: 10px;
			opacity: 0.2;
			pointer-events: none;
			transform: translateY(-80%);
			mask-image: linear-gradient(to bottom, transparent, black 22%);
		}

		.hero-chart-left { left: max(28px, calc((100% - 1320px) / 2)); }
		.hero-chart-right { right: max(28px, calc((100% - 1320px) / 2)); }

		.hero-chart span {
			flex: 1;
			border-radius: 5px 5px 0 0;
			background: var(--bar-color);
		}

		.hero-chart span:nth-child(1) { height: 38%; }
		.hero-chart span:nth-child(2) { height: 58%; }
		.hero-chart span:nth-child(3) { height: 46%; }
		.hero-chart span:nth-child(4) { height: 88%; }
		.hero-chart span:nth-child(5) { height: 68%; }
		.hero-chart span:nth-child(6) { height: 100%; }

		.hero-chart span:nth-child(1) { --bar-color: #d8745f; }
		.hero-chart span:nth-child(2) { --bar-color: #e2b94b; }
		.hero-chart span:nth-child(3) { --bar-color: #438eb0; }
		.hero-chart span:nth-child(4) { --bar-color: #087e78; }
		.hero-chart span:nth-child(5) { --bar-color: #a7658b; }
		.hero-chart span:nth-child(6) { --bar-color: #df8a4a; }

		.hero-content {
			position: relative;
			top: -80px;
			width: min(100% - 48px, 1240px);
			margin: 0 auto;
			padding: 80px 0;
			text-align: center;
		}

		.hero-kicker {
			margin: 0 0 20px;
			color: var(--accent-dark);
			font-size: 13px;
			font-weight: 400;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		.hero h1 {
			max-width: 680px;
			margin: 0 auto;
			font-size: 56px;
			font-weight: 400;
			line-height: 1.08;
		}

		.hero-description {
			max-width: 520px;
			margin: 22px auto 0;
			color: var(--muted);
			font-size: 18px;
			line-height: 1.6;
		}

		.hero-actions {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 24px;
			margin-top: 32px;
		}

		.hero-primary {
			min-height: 48px;
			display: inline-flex;
			align-items: center;
			padding: 0 20px;
			border-radius: 6px;
            border: 1px solid var(--accent);
			background: transparent;
			color: var(--accent);
			font-size: 15px;
			font-weight: 700;
			text-decoration: none;
			transition: background 150ms ease, transform 150ms ease;
		}
        .hero-primary:focus {
            outline: 2px solid var(--accent-dark);
            outline-offset: 2px;
        }
       

		.hero-primary:hover {
			background: var(--accent-dark);
			transform: translateY(-1px);
		}

		.hero-secondary {
			color: var(--accent-dark);
			font-size: 15px;
			font-weight: 650;
			text-decoration-color: rgba(6, 100, 95, 0.55);
			text-underline-offset: 5px;
		}

		.hero-secondary:hover { text-decoration-color: var(--accent-dark); }

		.nav-links {
			display: flex;
			align-items: center;
			gap: 8px;
			height: 72px;
			margin: 0;
			padding: 0;
			list-style: none;
			justify-self: center;
		}

		.nav-links a {
			display: inline-flex;
			align-items: center;
			height: 100%;
			padding: 0 14px;
			border-bottom: 2px solid transparent;
			color: var(--muted);
			text-decoration: none;
			font-size: 20px;
			font-weight: 400;
			transition: color 150ms ease, border-color 150ms ease;
		}

		.nav-links a:hover,
		.nav-links a[aria-current="page"] {
			border-bottom-color: var(--accent);
			color: var(--accent-dark);
		}

		.nav-actions {
			display: flex;
			align-items: center;
			gap: 16px;
			justify-self: end;
		}

		.account-link {
			color: var(--muted);
			text-decoration: none;
			font-size: 20px;
			font-weight: 400;
		}

		.account-link:hover { color: var(--ink); }

		.campaign-button {
			min-height: 40px;
			padding: 0 16px;
			border: 1px solid var(--accent);
			border-radius: 1px;
			background: transparent;
			color: var(--accent);
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 650;
			transition: background 150ms ease, transform 150ms ease;
		}

		.campaign-button:hover {
			background: rgba(8, 126, 120, 0.08);
			transform: translateY(-1px);
		}

		.menu-toggle {
			display: none;
			width: 40px;
			height: 40px;
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: white;
			color: var(--ink);
			cursor: pointer;
		}

		.menu-toggle span {
			display: block;
			height: 2px;
			margin: 4px 0;
			background: currentColor;
		}

		@media (max-width: 1080px) {
			.hero-chart { display: none; }
		}

		@media (max-width: 760px) {
			.hero {
				min-height: min(620px, calc(100svh - 64px));
			}

			.hero-content {
				top: -56px;
				width: min(100% - 32px, 1240px);
				padding: 72px 0;
			}

			.hero h1 { max-width: 540px; font-size: 42px; }
			.hero-description { max-width: 440px; font-size: 16px; }

			.nav-shell {
				display: flex;
				width: min(100% - 32px, 1240px);
				min-height: 64px;
				flex-wrap: wrap;
				gap: 0;
			}

			.brand { min-height: 64px; }

			.menu-toggle {
				display: block;
				margin-left: auto;
			}

			.nav-links {
				display: none;
				order: 3;
				width: 100%;
				height: auto;
				padding: 4px 0 12px;
				border-top: 1px solid var(--line);
			}

			.nav-links.is-open { display: block; }

			.nav-links a {
				width: 100%;
				min-height: 44px;
				padding: 0 8px;
				border-bottom: 0;
			}

			.nav-links a[aria-current="page"] { color: var(--accent-dark); }

			.nav-actions { margin-left: 12px; }
			.account-link { display: none; }
			.campaign-button { min-height: 38px; padding: 0 12px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 13px; }
		}

		@media (max-width: 390px) {
			.hero-content { width: min(100% - 24px, 1240px); }
			.hero h1 { font-size: 36px; }
			.hero-actions { align-items: center; flex-direction: column; gap: 18px; }
			.nav-shell { width: min(100% - 24px, 1240px); }
			.brand { gap: 8px; font-size: 16px; }
			.brand-mark { width: 30px; height: 30px; }
			.campaign-button { font-size: 13px; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<nav class="nav-shell" aria-label="Main navigation">
			<a class="brand" href="#overview" aria-label="ATU home">
				<span class="brand-mark" aria-hidden="true">ATU</span>
				<span class="brand-text">ATTENDANCE</span>
			</a>

			<button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-links">
				<span></span>
				<span></span>
				<span></span>
			</button>

			<ul class="nav-links" id="primary-links">
				<li><a href="#students">Students</a></li>
				<li><a href="#classes">Classes</a></li>
				<li><a href="#reports">Reports</a></li>
			</ul>

			<div class="nav-actions">
				<a class="account-link" href="login.html">Sign In</a>
				<button class="campaign-button" type="button">Register Class</button>
			</div>
		</nav>
	</header>
	<main>
		<section class="hero" aria-labelledby="hero-title">
			<div class="hero-chart hero-chart-left" aria-hidden="true">
				<span></span><span></span><span></span><span></span><span></span><span></span>
			</div>
			<div class="hero-chart hero-chart-right" aria-hidden="true">
				<span></span><span></span><span></span><span></span><span></span><span></span>
			</div>
			<div class="hero-content">
				<h1 id="hero-title">Manage student attendance with ease</h1>
				<p class="hero-description">Keep class records organized, record attendance quickly, and make every school day easier to manage.</p>
				<div class="hero-actions">
					<a class="hero-primary" href="#classes">Register a class</a>
					<a class="hero-primary" href="login.html">Sign In to your account</a>
				</div>
			</div>
		</section>
	</main>

	<script>
		const menuToggle = document.querySelector('.menu-toggle');
		const primaryLinks = document.querySelector('.nav-links');

		menuToggle.addEventListener('click', () => {
			const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
			menuToggle.setAttribute('aria-expanded', String(!isOpen));
			menuToggle.setAttribute('aria-label', isOpen ? 'Open navigation menu' : 'Close navigation menu');
			primaryLinks.classList.toggle('is-open', !isOpen);
		});
	</script>
</body>
</html>
